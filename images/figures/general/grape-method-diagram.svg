<svg viewBox="0 0 700 580" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="gModel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="gDomains" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="gTasks" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <filter id="sh" x="-12%" y="-12%" width="124%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12"
                    flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <marker id="ah" markerWidth="10" markerHeight="8"
            refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 1 L 9 4 L 0 7 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="700" height="580" rx="16" fill="#f8fafc"/>

  <!-- Iteration header -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.1s" dur="0.4s" fill="freeze"/>
    <rect x="200" y="14" width="300" height="26" rx="6" fill="#e0e7ff"/>
    <text x="350" y="32" text-anchor="middle"
          fill="#3730a3" font-size="12.5" font-weight="600"
          font-family="'Courier New', monospace">for  t = 1, …, T</text>
  </g>

  <!-- NODE 1 — Language Model θ -->
  <g opacity="0" filter="url(#sh)">
    <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.6s" fill="freeze"/>
    <rect x="130" y="58" width="440" height="96" rx="48" fill="url(#gModel)"/>
    <rect x="130" y="58" width="440" height="96" rx="48"
          fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.2"/>
    <rect x="130" y="58" width="440" height="2" rx="2" fill="rgba(255,255,255,0.14)"/>
    <text x="350" y="92" text-anchor="middle"
          fill="white" font-size="19" font-weight="700"
          font-family="Inter, sans-serif" letter-spacing="0.3">Language Model  θ</text>
    <text x="350" y="118" text-anchor="middle"
          fill="rgba(255,255,255,0.72)" font-size="12.5"
          font-family="Inter, sans-serif">
      sample  x ~ mix(α)  ·  update  θ  via gradient descent
    </text>
  </g>

  <!-- NODE 2 — Source Domains -->
  <g opacity="0" filter="url(#sh)">
    <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.6s" fill="freeze"/>
    <rect x="18" y="285" width="270" height="220" rx="16" fill="url(#gDomains)"/>
    <rect x="18" y="285" width="270" height="220" rx="16"
          fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.2"/>
    <rect x="18" y="285" width="270" height="2" rx="2" fill="rgba(255,255,255,0.14)"/>

    <text x="153" y="312" text-anchor="middle"
          fill="white" font-size="14.5" font-weight="700"
          font-family="Inter, sans-serif">Source Domains</text>
    <text x="153" y="330" text-anchor="middle"
          fill="rgba(255,255,255,0.58)" font-size="11"
          font-family="Inter, sans-serif">K domains · mixture weights  α</text>

    <!-- Code bar — shrinks when dot arrives (less aligned) -->
    <circle cx="40" cy="358" r="5" fill="#67e8f9" opacity="0.9"/>
    <text x="52" y="362" fill="rgba(255,255,255,0.85)" font-size="11.5"
          font-family="Inter, sans-serif">Code</text>
    <rect x="105" y="352" width="148" height="11" rx="5.5" fill="rgba(255,255,255,0.12)"/>
    <rect x="105" y="352" width="148" height="11" rx="5.5" fill="#22d3ee" opacity="0.7">
      <animate attributeName="width"   values="148;148;112;148" keyTimes="0;0.82;0.93;1" dur="3.5s" begin="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.7;1.0;0.7" keyTimes="0;0.82;0.93;1" dur="3.5s" begin="3.6s" repeatCount="indefinite"/>
    </rect>

    <!-- Web bar — shrinks slightly -->
    <circle cx="40" cy="385" r="5" fill="#6ee7b7" opacity="0.9"/>
    <text x="52" y="389" fill="rgba(255,255,255,0.85)" font-size="11.5"
          font-family="Inter, sans-serif">Web</text>
    <rect x="105" y="379" width="148" height="11" rx="5.5" fill="rgba(255,255,255,0.12)"/>
    <rect x="105" y="379" width="95" height="11" rx="5.5" fill="#10b981" opacity="0.7">
      <animate attributeName="width"   values="95;95;78;95"     keyTimes="0;0.84;0.94;1" dur="3.5s" begin="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.7;1.0;0.7" keyTimes="0;0.84;0.94;1" dur="3.5s" begin="3.6s" repeatCount="indefinite"/>
    </rect>

    <!-- Books bar — GROWS: most aligned with slow tasks → α boosted -->
    <circle cx="40" cy="412" r="5" fill="#fbbf24" opacity="0.9">
      <animate attributeName="r"       values="5;5;8;8;5"           keyTimes="0;0.86;0.94;1;1" dur="3.5s" begin="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.9;1;1;0.9"     keyTimes="0;0.86;0.94;1;1" dur="3.5s" begin="3.6s" repeatCount="indefinite"/>
    </circle>
    <text x="52" y="416" fill="rgba(255,255,255,0.85)" font-size="11.5"
          font-family="Inter, sans-serif">Books</text>
    <rect x="105" y="406" width="148" height="11" rx="5.5" fill="rgba(255,255,255,0.12)"/>
    <rect x="105" y="406" width="65" height="11" rx="5.5" fill="#f59e0b" opacity="0.7">
      <animate attributeName="width"   values="65;65;143;65"    keyTimes="0;0.86;0.96;1" dur="3.5s" begin="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.7;1.0;0.7" keyTimes="0;0.86;0.96;1" dur="3.5s" begin="3.6s" repeatCount="indefinite"/>
    </rect>

    <!-- Math bar — shrinks -->
    <circle cx="40" cy="439" r="5" fill="#c4b5fd" opacity="0.9"/>
    <text x="52" y="443" fill="rgba(255,255,255,0.85)" font-size="11.5"
          font-family="Inter, sans-serif">Math</text>
    <rect x="105" y="433" width="148" height="11" rx="5.5" fill="rgba(255,255,255,0.12)"/>
    <rect x="105" y="433" width="115" height="11" rx="5.5" fill="#a78bfa" opacity="0.7">
      <animate attributeName="width"   values="115;115;88;115"  keyTimes="0;0.84;0.94;1" dur="3.5s" begin="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.7;1.0;0.7" keyTimes="0;0.84;0.94;1" dur="3.5s" begin="3.6s" repeatCount="indefinite"/>
    </rect>

    <text x="153" y="489" text-anchor="middle"
          fill="rgba(255,255,255,0.45)" font-size="10"
          font-family="Inter, sans-serif" font-style="italic">
      ⟨g_domain, g_tasks⟩ high  →  α ↑
    </text>
  </g>

  <!-- NODE 3 — Target Tasks -->
  <g opacity="0" filter="url(#sh)">
    <animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="0.6s" fill="freeze"/>
    <rect x="412" y="285" width="270" height="220" rx="16" fill="url(#gTasks)"/>
    <rect x="412" y="285" width="270" height="220" rx="16"
          fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.2"/>
    <rect x="412" y="285" width="270" height="2" rx="2" fill="rgba(255,255,255,0.14)"/>

    <text x="547" y="312" text-anchor="middle"
          fill="white" font-size="14.5" font-weight="700"
          font-family="Inter, sans-serif">Target Tasks</text>
    <text x="547" y="330" text-anchor="middle"
          fill="rgba(255,255,255,0.58)" font-size="11"
          font-family="Inter, sans-serif">N tasks · Group DRO weights  z</text>

    <!-- ARC-Easy: fast → z stays low -->
    <text x="432" y="360" fill="rgba(255,255,255,0.80)" font-size="11.5"
          font-family="Inter, sans-serif">ARC-Easy</text>
    <rect x="520" y="349" width="110" height="11" rx="5.5" fill="rgba(255,255,255,0.12)"/>
    <rect x="520" y="349" width="90"  height="11" rx="5.5" fill="rgba(255,255,255,0.38)"/>

    <!-- PIQA: slow → z GROWS (boosted by GRAPE) when dot departs -->
    <text x="432" y="387" fill="white" font-size="11.5" font-weight="600"
          font-family="Inter, sans-serif">PIQA</text>
    <rect x="520" y="376" width="110" height="11" rx="5.5" fill="rgba(255,255,255,0.12)"/>
    <rect x="520" y="376" width="26" height="11" rx="5.5" fill="#fbbf24" opacity="0.85">
      <animate attributeName="width"   values="26;26;95;95;26"   keyTimes="0;0.04;0.18;0.75;1" dur="3.5s" begin="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0.85;1;1;0.85" keyTimes="0;0.04;0.18;0.75;1" dur="3.5s" begin="3.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="638" y="373" width="40" height="17" rx="8" fill="#dc2626" opacity="0.85"/>
    <text x="658" y="385" text-anchor="middle" fill="white" font-size="9" font-weight="700"
          font-family="Inter, sans-serif">slow ↑z</text>

    <!-- LogiQA: slow → z GROWS -->
    <text x="432" y="414" fill="white" font-size="11.5" font-weight="600"
          font-family="Inter, sans-serif">LogiQA</text>
    <rect x="520" y="403" width="110" height="11" rx="5.5" fill="rgba(255,255,255,0.12)"/>
    <rect x="520" y="403" width="20" height="11" rx="5.5" fill="#fbbf24" opacity="0.85">
      <animate attributeName="width"   values="20;20;90;90;20"   keyTimes="0;0.05;0.19;0.75;1" dur="3.5s" begin="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0.85;1;1;0.85" keyTimes="0;0.05;0.19;0.75;1" dur="3.5s" begin="3.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="638" y="400" width="40" height="17" rx="8" fill="#dc2626" opacity="0.85"/>
    <text x="658" y="412" text-anchor="middle" fill="white" font-size="9" font-weight="700"
          font-family="Inter, sans-serif">slow ↑z</text>

    <!-- SciQ: fast → z stays low -->
    <text x="432" y="441" fill="rgba(255,255,255,0.80)" font-size="11.5"
          font-family="Inter, sans-serif">SciQ</text>
    <rect x="520" y="430" width="110" height="11" rx="5.5" fill="rgba(255,255,255,0.12)"/>
    <rect x="520" y="430" width="85"  height="11" rx="5.5" fill="rgba(255,255,255,0.38)"/>

    <text x="547" y="489" text-anchor="middle"
          fill="rgba(255,255,255,0.45)" font-size="10"
          font-family="Inter, sans-serif" font-style="italic">
      low RoI  →  z ↑  (Group DRO)
    </text>
  </g>

  <!-- ARROW 1: Domains → Model -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.5s" fill="freeze"/>
    <path id="mixPath" d="M 175 285 C 175 240, 215 195, 222 154"
          stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#ah)"/>
    <rect x="110" y="218" width="72" height="22" rx="5" fill="#f1f5f9"/>
    <text x="146" y="233" text-anchor="middle"
          fill="#475569" font-size="10.5" font-weight="600"
          font-family="Inter, sans-serif">mix(α)</text>
  </g>

  <!-- ARROW 2: Model → Tasks -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.2s" dur="0.5s" fill="freeze"/>
    <path d="M 478 154 C 485 195, 510 240, 525 285"
          stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#ah)"/>
    <rect x="508" y="208" width="80" height="22" rx="5" fill="#f1f5f9"/>
    <text x="548" y="223" text-anchor="middle"
          fill="#475569" font-size="10.5" font-weight="600"
          font-family="Inter, sans-serif">measure  RoI</text>
  </g>

  <!-- ARROW 3: Tasks → Domains (Group DRO feedback) -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.9s" dur="0.5s" fill="freeze"/>
    <path id="fbArc"
          d="M 547 505 C 547 558, 153 558, 153 505"
          stroke="#64748b" stroke-width="2"
          stroke-dasharray="6 4" fill="none"
          marker-end="url(#ah)"/>
    <rect x="262" y="547" width="176" height="22" rx="5" fill="#f1f5f9"/>
    <text x="350" y="562" text-anchor="middle"
          fill="#475569" font-size="10.5" font-weight="600"
          font-family="Inter, sans-serif">z (Group DRO)  →  α (grad. alignment)</text>
  </g>

  <!-- CENTER LABEL -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="3.2s" dur="0.6s" fill="freeze"/>
    <rect x="254" y="232" width="192" height="48" rx="10"
          fill="white" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="350" y="254" text-anchor="middle"
          fill="#0f172a" font-size="11" font-weight="700"
          font-family="Inter, sans-serif">🍇 GRAPE</text>
    <text x="350" y="271" text-anchor="middle"
          fill="#64748b" font-size="10" font-style="italic"
          font-family="Inter, sans-serif">prioritize slow tasks</text>
  </g>

  <!-- SAMPLING DOTS: x ~ mix(α) flowing Domains → Model, colors = domain identity -->
  <!-- Code sample (cyan) -->
  <circle r="3.5" fill="#67e8f9" opacity="0">
    <animate attributeName="opacity" from="0" to="0.8" begin="3.6s" dur="0.3s" fill="freeze"/>
    <animateMotion dur="1.7s" begin="3.6s" repeatCount="indefinite">
      <mpath xlink:href="#mixPath"/>
    </animateMotion>
  </circle>
  <!-- Web sample (green) -->
  <circle r="3" fill="#6ee7b7" opacity="0">
    <animate attributeName="opacity" from="0" to="0.7" begin="3.6s" dur="0.3s" fill="freeze"/>
    <animateMotion dur="1.7s" begin="4.25s" repeatCount="indefinite">
      <mpath xlink:href="#mixPath"/>
    </animateMotion>
  </circle>
  <!-- Books sample (amber) — grows after α update to show more Books data sampled -->
  <circle r="3" fill="#f59e0b" opacity="0">
    <animate attributeName="opacity" from="0" to="0.9" begin="3.6s" dur="0.3s" fill="freeze"/>
    <animate attributeName="r" values="3;3;5.5;5.5;3" keyTimes="0;0.85;0.94;1;1" dur="3.5s" begin="3.6s" repeatCount="indefinite"/>
    <animateMotion dur="1.7s" begin="4.85s" repeatCount="indefinite">
      <mpath xlink:href="#mixPath"/>
    </animateMotion>
  </circle>

  <!-- TRAVELING DOT -->
  <circle r="5.5" fill="#0891b2" opacity="0">
    <animate attributeName="opacity" from="0" to="0.85"
             begin="3.6s" dur="0.3s" fill="freeze"/>
    <animateMotion dur="3.5s" repeatCount="indefinite" begin="3.6s">
      <mpath xlink:href="#fbArc"/>
    </animateMotion>
  </circle>

</svg>
