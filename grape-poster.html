<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Grape Poster</title>
    <link rel="icon" href="/images/favicon.ico">
    <link rel="preload" href="/assets/webfonts/fa-solid-900.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/assets/css/main.css">
    <style>
        /* Page setup for printing as a poster */
        @page { size: A4; margin: 0; }
        @media print {
            .no-print { display: none !important; }
            .poster { box-shadow: none !important; }
        }

        html, body {
            height: 100%;
            margin: 0;
        }

        .wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0e0e0f;
        }

        .poster {
            width: 794px; /* A4 width at 96dpi */
            height: 1123px; /* A4 height at 96dpi */
            position: relative;
            color: #ffffff;
            background: url('/images/bg.jpg') center/cover no-repeat, #111;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.55) 50%, rgba(0,0,0,0.85) 100%);
        }

        .content {
            position: relative;
            z-index: 2;
            height: 100%;
            padding: 56px;
            display: flex;
            flex-direction: column;
        }

        .badge {
            align-self: flex-start;
            letter-spacing: 0.3em;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 32px;
            padding: 8px 14px;
        }

        .spacer { flex: 1; }

        .title {
            font-size: 88px;
            line-height: 0.95;
            margin: 0 0 12px 0;
            font-weight: 800;
            letter-spacing: -0.02em;
            text-shadow: 0 6px 24px rgba(0,0,0,0.6);
        }

        .subtitle {
            font-size: 22px;
            max-width: 70%;
            margin: 0 0 28px 0;
            color: rgba(255,255,255,0.85);
        }

        .cta-row {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #6c5ce7;
            color: #fff;
            text-decoration: none;
            padding: 14px 18px;
            border-radius: 10px;
            font-weight: 700;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            box-shadow: 0 10px 24px rgba(108,92,231,0.4);
        }
        .button:hover { transform: translateY(-2px); }

        .meta {
            font-size: 13px;
            color: rgba(255,255,255,0.7);
        }

        .embed {
            position: absolute;
            right: 40px;
            top: 56px;
            width: 240px;
            height: 340px;
            border-radius: 10px;
            overflow: hidden;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.15);
            backdrop-filter: blur(2px);
        }

        .footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-top: auto;
            padding-top: 18px;
            border-top: 1px solid rgba(255,255,255,0.15);
            font-size: 12px;
            color: rgba(255,255,255,0.7);
        }

        .url {
            color: rgba(255,255,255,0.9);
            text-decoration: none;
            word-break: break-all;
        }

        /* On small screens allow scrolling to view */
        @media (max-width: 820px) {
            .poster { width: 100vw; height: 140vw; }
            .embed { display: none; }
            .subtitle { max-width: 100%; }
        }
    </style>
    <meta name="robots" content="noindex">
</head>
<body>
    <div class="wrapper">
        <div class="poster">
            <div class="overlay"></div>
            <div class="content">
                <div class="badge">Document Poster</div>

                <div class="embed no-print">
                    <iframe src="/grape.pdf#toolbar=0&navpanes=0&scrollbar=0" title="Grape PDF preview" width="100%" height="100%"></iframe>
                </div>

                <div class="spacer"></div>

                <h1 class="title">GRAPE</h1>
                <p class="subtitle">Download and read the Grape document. Scan or visit the link below to access the PDF instantly.</p>

                <div class="cta-row">
                    <a class="button" href="/grape.pdf" target="_blank" rel="noopener">Download PDF</a>
                    <span class="meta">File: grape.pdf</span>
                </div>

                <div class="footer">
                    <span>Prepared for print/export</span>
                    <a class="url" href="/grape.pdf">https://meglr.github.io/grape.pdf</a>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Optional: auto-open print dialog when query ?print is present
        (function(){
            if (new URLSearchParams(window.location.search).has('print')) {
                setTimeout(function(){ window.print(); }, 400);
            }
        })();
    </script>
</body>
</html>
